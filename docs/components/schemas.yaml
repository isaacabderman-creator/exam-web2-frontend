StudentDTO:
  type: object
  properties:
    name:
      type: string
      example: Niu Lai
    email:
      type: string
      example: niulai@gmail.com
    role:
      type: string
      enum: [ admin, student ]
      example: admin
StudentSummary:
  type: object
  allOf:
    - $ref: "#/StudentDTO"
  properties:
    id:
      type: integer
      example: 67
  required: [id, name, email, role]
Student:
  type: object
  allOf:
    - $ref: "#/StudentSummary"
  properties:
    password:
      type: string
      example: "password"
CourseDTO:
  type: object
  properties:
    code:
      type: string
      example: PROG2
    name:
      type: string
      example: Programmation Orientée Objet
    description:
      type: string
      example: Course about OOP
Course:
  type: object

Error:
  type: object
  properties:
    title:
      type: string
      example: Ressource not found
    type:
      type: string
      example: "https://example.com/not-found"
    detail:
      type: string
      example: The given path doesn't exist
    status:
      type: integer
      example: 404