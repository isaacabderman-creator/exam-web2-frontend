StudentDTO:
  type: object
  properties:
    name:
      type: string
      example: Niu Lai
    email:
      type: string
      example: niulai@gmail.com
    role:
      type: string
      enum: [ admin, student ]
      example: admin
StudentSummary:
  type: object
  allOf:
    - $ref: "#/StudentDTO"
  properties:
    id:
      type: integer
      example: 67
  required: [id, name, email, role]
Student:
  type: object
  allOf:
    - $ref: "#/StudentSummary"
  properties:
    password:
      type: string
      example: "password"

CourseDTO:
  type: object
  properties:
    code:
      type: string
      example: PROG2
    name:
      type: string
      example: Programmation Orientée Objet
    description:
      type: string
      example: Course about OOP
Course:
  type: object
  allOf:
    - $ref: "#/CourseDTO"
  properties:
    id:
      type: integer
      example: 12
  required: [id, code, name, description]
ExamDTO:
  type: object
  properties:
    courseId:
      type: integer
      example: 12
    title:
      type: string
      example: Midterm Exam
    startsAt:
      type: string
      format: date-time
      example: "2026-09-01T09:00:00Z"
    endsAt:
      type: string
      format: date-time
      example: "2026-09-01T11:00:00Z"
  required: [courseId, title, startsAt, endsAt]
Exam:
  type: object
  allOf:
    - $ref: "#/ExamDTO"
  properties:
    id:
      type: integer
      example: 5
    locked:
      type: boolean
      description: "True once the exam has an attempt (RG-08)."
      example: false
  required: [id, locked, courseId, title, startsAt, endsAt]

Error:
  type: object
  properties:
    title:
      type: string
      example: Ressource not found
    type:
      type: string
      example: "https://example.com/not-found"
    detail:
      type: string
      example: The given path doesn't exist
    status:
      type: integer
      example: 404