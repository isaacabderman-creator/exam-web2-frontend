StudentDTO:
  type: object
  properties:
    name:
      type: string
      example: Niu Lai
    email:
      type: string
      example: niulai@gmail.com
    role:
      type: string
      enum: [ admin, student ]
      example: admin
StudentSummary:
  type: object
  allOf:
    - $ref: "#/StudentDTO"
  properties:
    id:
      type: integer
      example: 67
  required: [id, name, email, role]
Student:
  type: object
  allOf:
    - $ref: "#/StudentSummary"
  properties:
    password:
      type: string
      example: "password"

CourseDTO:
  type: object
  properties:
    code:
      type: string
      example: PROG2
    name:
      type: string
      example: Programmation Orientée Objet
    description:
      type: string
      example: Course about OOP
Course:
  type: object
  allOf:
    - $ref: "#/CourseDTO"
  properties:
    id:
      type: integer
      example: 12
  required: [id, code, name, description]
ExamDTO:
  type: object
  properties:
    courseId:
      type: integer
      example: 12
    title:
      type: string
      example: Midterm Exam
    startsAt:
      type: string
      format: date-time
      example: "2026-09-01T09:00:00Z"
    endsAt:
      type: string
      format: date-time
      example: "2026-09-01T11:00:00Z"
  required: [courseId, title, startsAt, endsAt]
Exam:
  type: object
  allOf:
    - $ref: "#/ExamDTO"
  properties:
    id:
      type: integer
      example: 5
    locked:
      type: boolean
      description: "True once the exam has an attempt (RG-08)."
      example: false
  required: [id, locked, courseId, title, startsAt, endsAt]

ChoiceDTO:
  type: object
  properties:
    text:
      type: string
      example: Paris
    isCorrect:
      type: boolean
      example: true
  required: [text, isCorrect]
Choice:
  type: object
  allOf:
    - $ref: "#/ChoiceDTO"
  properties:
    id:
      type: integer
      example: 3
  required: [id, text, isCorrect]
QuestionDTO:
  type: object
  properties:
    text:
      type: string
      example: What is the capital of France?
    choices:
      type: array
      minItems: 2
      maxItems: 6
      description: "2-6 choices, exactly one correct (RG-04)."
      items:
        $ref: "#/ChoiceDTO"
  required: [text, choices]
Question:
  type: object
  properties:
    id:
      type: integer
      example: 8
    examId:
      type: integer
      example: 5
    text:
      type: string
      example: What is the capital of France?
    choices:
      type: array
      items:
        $ref: "#/Choice"
  required: [id, examId, text, choices]

PublicChoice:
  type: object
  description: "No isCorrect field (RG-07)."
  properties:
    id:
      type: integer
      example: 3
    text:
      type: string
      example: Paris
  required: [id, text]
QuestionPublic:
  type: object
  description: "Distinct from Question — no isCorrect (RG-07)."
  properties:
    id:
      type: integer
      example: 8
    text:
      type: string
      example: What is the capital of France?
    choices:
      type: array
      items:
        $ref: "#/PublicChoice"
  required: [id, text, choices]
ExamWithQuestions:
  type: object
  allOf:
    - $ref: "#/Exam"
  properties:
    questions:
      type: array
      items:
        $ref: "#/QuestionPublic"
  required: [questions]

Error:
  type: object
  properties:
    title:
      type: string
      example: Ressource not found
    type:
      type: string
      example: "https://example.com/not-found"
    detail:
      type: string
      example: The given path doesn't exist
    status:
      type: integer
      example: 404