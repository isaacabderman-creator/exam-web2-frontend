examsCollection:
  get:
    summary: Get exams
    security:
      - bearerAuth: []
    responses:
      "200":
        description: List of exams
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../openapi.yaml#/components/schemas/Exam"
      "401":
        description: Missing or invalid token
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
  post:
    summary: Create an exam
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ExamDTO"
    responses:
      "201":
        description: Exam created
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Exam"
      "401":
        description: Missing or invalid token
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "422":
        description: Invalid Data
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
examsItem:
  parameters:
    - in: path
      required: true
      name: id
      description: Exam ID
      schema:
        type: integer
        example: 5
  get:
    summary: Get an exam
    security:
      - bearerAuth: []
    responses:
      "200":
        description: Exam found
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Exam"
      "401":
        description: Missing or invalid token
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "404":
        description: Exam not found
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
  put:
    summary: Modify an exam
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ExamDTO"
    responses:
      "200":
        description: Exam modified successfully
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Exam"
      "401":
        description: Missing or invalid token
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "404":
        description: Exam not found
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "422":
        description: Invalid Data
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
  delete:
    summary: Delete an exam
    security:
      - bearerAuth: []
    responses:
      "204":
        description: Exam deleted successfully
      "401":
        description: Missing or invalid token
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "404":
        description: Exam not found
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "409":
        description: "Exam has attempts (RG-09)"
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
