coursesCollection:
  get:
    summary: Get courses
    responses:
      "200":
        description: List of courses
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../openapi.yaml#/components/schemas/Course"
      "401":
        description: Missing or invalid token
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
  post:
    summary: Create courses
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../openapi.yaml#/components/schemas/CourseDTO"
    responses:
      "201":
        description: Courses created
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Course"
      "401":
        description: Missing or invalid token
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "422":
        description: Invalid Data
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
coursesItem:
  parameters:
    - in: path
      required: true
      name: id
      description: Course ID
      schema:
        type: integer
        example: 12
  put:
    summary: Modify a course
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/CourseDTO"
    responses:
      "200":
        description: Course modified successfully
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Course"
      "401":
        description: Missing or invalid token
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "404":
        description: Course not found
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "422":
        description: Invalid Data
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
  delete:
    summary: Delete a course
    security:
      - bearerAuth: []
    responses:
      "204":
        description: Course deleted successfully
      "401":
        description: Missing or invalid token
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "404":
        description: Course not found
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "409":
        description: "Course has exams (RG-09)"
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"