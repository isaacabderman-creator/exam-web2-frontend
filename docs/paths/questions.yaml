questionsItem:
  parameters:
    - in: path
      required: true
      name: id
      description: Question ID
      schema:
        type: integer
        example: 8
  put:
    summary: Modify a question
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/QuestionDTO"
    responses:
      "200":
        description: Question modified successfully
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Question"
      "400":
        description: "Invalid choices (RG-04)"
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "401":
        description: Missing or invalid token
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "404":
        description: Question not found
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "409":
        description: "Exam locked (RG-08)"
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
  delete:
    summary: Delete a question
    security:
      - bearerAuth: []
    responses:
      "204":
        description: Question deleted successfully
      "401":
        description: Missing or invalid token
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "404":
        description: Question not found
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
      "409":
        description: "Exam locked (RG-08)"
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
