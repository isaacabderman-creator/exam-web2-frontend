openapi: 3.0.3
info:
  title: Student API
  version: 1.0.0
  description: Management of students and exams
servers:
  - url: "127.0.0.1:{port}/api"
    description: Local dev
    variables:
      port:
        default: "3000"
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      description: "Login for users and admin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  default: niulai@gmail.com
                password:
                  type: string
                  default: Mamaaa

      responses:
        "200":
          description: User authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    format: jwt
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMiJ9.4Adcj3UFYqk
                  user:
                    $ref: "#/components/schemas/StudentSummary"
        "401":
          description: Credentials invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    StudentSummary:
      type: object
      properties:
        id:
          type: integer
          example: 67
        name:
          type: string
          example: Niu Lai
        email:
          type: string
          example: niulai@gmail.com
        role:
          type: string
          enum: [admin, student]
          example: admin
      required: [id, name, email, role]
    Error:
      type: object
      properties:
        title:
          type: string
          example: Ressource not found
        type:
          type: string
          example: "https://example.com/not-found"
        detail:
          type: string
          example: The given path doesn't exist
        status:
          type: integer
          example: 404
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

