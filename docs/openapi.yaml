openapi: 3.0.3
info:
  title: Student API
  version: 1.0.0
  description: Management of students and exams
servers:
  - url: "127.0.0.1:{port}/api"
    description: Local dev
    variables:
      port:
        default: "3000"
security:
  - bearerAuth: []
paths:
  /auth/login:
    $ref: "./paths/auth/login.yaml#/login"
  /api/students:
    $ref: "./paths/students.yaml#/studentsCollection"
  /api/courses:
    $ref: "./paths/courses.yaml#/coursesCollection"

components:
  schemas:
    StudentDTO:
      $ref: "./components/schemas.yaml#/StudentDTO"
    StudentSummary:
      $ref: "./components/schemas.yaml#/StudentSummary"
    Student:
      $ref: "./components/schemas.yaml#/Student"
    CourseDTO:
      $ref: "./components/schemas.yaml#/CourseDTO"
    Course:
      $ref: "./components/schemas.yaml#/Course"
    Error:
      $ref: "./components/schemas.yaml#/Error"
  securitySchemes:
    bearerAuth:
      $ref: "./components/securitySchemes.yaml#/bearerAuth"

