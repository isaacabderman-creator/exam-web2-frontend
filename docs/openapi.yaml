openapi: 3.0.3
info:
  title: Student API
  version: 1.0.0
  description: Management of students and exams
servers:
  - url: "127.0.0.1:{port}/api"
    description: Local dev
    variables:
      port:
        default: "3000"
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      summary: "Login for users and admin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  default: niulai@gmail.com
                password:
                  type: string
                  default: Mamaaa

      responses:
        "200":
          description: User authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    format: jwt
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMiJ9.4Adcj3UFYqk
                  user:
                    $ref: "#/components/schemas/StudentSummary"
        "401":
          description: Credentials invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/students:
    $ref: "./paths/students.yaml#/studentsCollection"
  /api/courses:
    get:
      summary: Get courses
      responses:
        "200":
          description: List of courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create courses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/CourseDTO"
      responses:
        "201":
          description: Courses created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid Data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    StudentDTO:
      $ref: "./components/schemas.yaml#/StudentDTO"
    StudentSummary:
      $ref: "./components/schemas.yaml#/StudentSummary"
    Student:
      $ref: "./components/schemas.yaml#/Student"
    CourseDTO:
      $ref: "./components/schemas.yaml#/CourseDTO"
    Course:
      $ref: "./components/schemas.yaml#/Course"
    Error:
      $ref: "./components/schemas.yaml#/Error"
  securitySchemes:
    bearerAuth:
      $ref: "./components/securitySchemes.yaml#/bearerAuth"

